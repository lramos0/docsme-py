[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docsme"
version = "0.1.1"
description = "Generate a markdown yearly work summary prompt from git commits for a given username."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0.0",
]
authors = [
  {name = "OpenAI"}
]

[project.scripts]
docsme = "docsme.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
